name: feb (free expo builds)
description: Build Expo apps locally with `eas build --local` — no build queue, no EAS credits. Outputs .ipa/.apk/.aab.
author: Ahmad Atallah
branding:
  icon: package
  color: blue

inputs:
  platform:
    description: "Platform to build: ios | android | all (iOS needs a macOS runner)"
    required: true
  profile:
    description: Build profile from your eas.json
    required: true
  expo-token:
    description: Expo access token (create one at https://expo.dev/settings/access-tokens)
    required: true
  working-directory:
    description: Directory containing the Expo app (where eas.json lives)
    required: false
    default: "."
  pre-build-command:
    description: Command to run after install, before build (e.g. build a shared monorepo lib)
    required: false
    default: ""
  app-name:
    description: Artifact filename prefix (defaults to the app.json / package.json name)
    required: false
    default: ""
  cache:
    description: >-
      Cache native build downloads between runs with actions/cache: Gradle's
      dependency cache for Android, and ~/.rnrepo-cache (rnrepo.org prebuilt
      xcframeworks) for iOS. Keyed on the lockfile; counts against the repo's
      Actions cache quota.
    required: false
    default: "false"

outputs:
  ios-artifact:
    description: Path to the built iOS artifact (empty if not built)
    value: ${{ steps.artifacts.outputs.ios-artifact }}
  android-artifact:
    description: Path to the built Android artifact (empty if not built)
    value: ${{ steps.artifacts.outputs.android-artifact }}
  output-dir:
    description: Absolute path to the build-output directory
    value: ${{ steps.artifacts.outputs.output-dir }}

runs:
  using: composite
  steps:
    # eas build --local works on a temp copy of the project, so anything a build
    # downloads into the project (node_modules/*/.rnrepo-cache) is gone after the
    # job. These two home-directory caches are what a later run can reuse.
    # android/ and ios/ are generated during the build, so the key is the
    # lockfile rather than any Gradle or Podfile.
    - name: Cache Gradle dependencies
      if: inputs.cache == 'true' && (inputs.platform == 'android' || inputs.platform == 'all')
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper/dists
          !~/.gradle/caches/modules-2/modules-2.lock
          !~/.gradle/caches/modules-2/gc.properties
        key: feb-gradle-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '!**/node_modules/**') }}
        restore-keys: feb-gradle-${{ runner.os }}-

    - name: Cache rnrepo prebuilds
      if: inputs.cache == 'true' && (inputs.platform == 'ios' || inputs.platform == 'all')
      uses: actions/cache@v4
      with:
        path: ~/.rnrepo-cache
        key: feb-rnrepo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '!**/node_modules/**') }}
        restore-keys: feb-rnrepo-${{ runner.os }}-

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
        APP_NAME: ${{ inputs.app-name }}
        # platform/profile go through env (not ${{ }} interpolation in `run`)
        # so untrusted workflow inputs cannot inject shell commands
        PLATFORM: ${{ inputs.platform }}
        PROFILE: ${{ inputs.profile }}
      run: bash "${{ github.action_path }}/build.sh" "$PLATFORM" "$PROFILE" --non-interactive

    - name: Collect artifacts
      id: artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Outputs must be absolute paths: consumers like actions/upload-artifact
      # resolve relative paths from the workspace root, not working-directory
      run: |
        shopt -s nullglob
        ios=("$PWD"/build-output/*.ipa "$PWD"/build-output/*.tar.gz)
        android=("$PWD"/build-output/*.apk "$PWD"/build-output/*.aab)
        {
          echo "ios-artifact=${ios[0]:-}"
          echo "android-artifact=${android[0]:-}"
          echo "output-dir=$PWD/build-output"
        } >> "$GITHUB_OUTPUT"
