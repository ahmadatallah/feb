# Example: build an Android APK/AAB on every push to main, for free,
# on a standard ubuntu runner — no EAS build credits consumed.
name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest leaves ~20 GB free on /, and a release build of an RN app
      # with native modules overruns it (C++ per ABI, Gradle caches, and EAS's
      # second copy of the project under /tmp). Reclaims ~20 GB of preinstalled
      # toolchains nothing here uses. Must run before the setup-* actions, which
      # populate the tool cache. See "Hosted-runner resources" in the README.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false # keep the Android SDK
          swap-storage: false # keep swap for Gradle + Metro
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ahmadatallah/feb@v1.1.2
        id: build
        with:
          platform: android
          profile: production
          expo-token: ${{ secrets.EXPO_TOKEN }}
          # working-directory: apps/mobile          # monorepos
          # pre-build-command: pnpm --filter @myorg/lib build

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ steps.build.outputs.android-artifact }}
